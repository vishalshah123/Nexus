server:
  port: 9095
spring:
  application:
    name: nexus-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/nexus}
    username: ${SPRING_DATASOURCE_USERNAME:nexus}
    password: ${POSTGRES_PASSWORD:nexus_dev_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${NEXUS_JWT_ISSUER_URI:http://localhost:8080/realms/nexus}
nexus:
  security:
    enabled: ${NEXUS_SECURITY_ENABLED:false}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
